[project]
name = "prompt-engineering-workbench"
version = "0.2.1"
description = "Local, offline-first controlled prompt experiment workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.13.5,<3",
    "openai-agents==0.22.3",
    "openai==3.16.2",
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "httpx2==2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pytest-of-*", "test-results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
